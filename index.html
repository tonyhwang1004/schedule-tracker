<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정기일정 제출 현황</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; }
    .present { box-shadow: 0 0 0 3px #22c55e; }
    .seat-num { font-size: 0.7rem; color: #6b7280; margin-right: 2px; }
    .seat-focus { font-size: 0.7rem; color: #8b5cf6; margin-right: 2px; font-weight: 600; }
    .seat-free { font-size: 0.7rem; color: #f97316; margin-right: 2px; font-weight: 600; }
    .drop-active { outline: 3px solid #3b82f6; outline-offset: 2px; }
    select { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 2px 4px; font-size: 0.75rem; max-width: 190px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-center mb-2">📚 정기일정 제출 현황</h1>
    <p class="text-center text-slate-500 text-sm mb-6">Google Sheets 실시간 연동</p>

    <div class="bg-white rounded-xl p-3 mb-4 flex flex-wrap items-center justify-between gap-2">
      <span id="status" class="text-sm text-slate-500">⏳ 로딩중...</span>
      <button onclick="loadGoogleSheets()" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-sm hover:bg-blue-600">🔄 새로고침</button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
      <label data-kind="sub"   class="block p-3 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer text-center bg-white"></label>
      <label data-kind="att8"  class="block p-3 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer text-center bg-white"></label>
      <label data-kind="att7"  class="block p-3 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer text-center bg-white"></label>
      <label data-kind="focus" class="block p-3 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer text-center bg-white"></label>
    </div>

    <div class="mb-3">
      <label data-kind="free" class="block p-3 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer text-center bg-white"></label>
      <div id="ocrReview" class="mt-2"></div>
      <div id="freeSeatResult" class="mt-2"></div>
    </div>

    <p class="text-xs text-slate-400 text-center mb-4">xlsx · xlsm · xlsb · xls · ods · csv · tsv · txt 지원 (한글 CSV 인코딩 자동 판별) · 좌석 배치도는 이미지(png · jpg)도 인식 · 드래그 앤 드롭 가능</p>

    <div id="diag" class="mb-4"></div>

    <div class="flex flex-wrap items-center gap-4 mb-4 text-sm text-slate-600">
      <span class="flex items-center gap-1"><span class="w-4 h-4 rounded border-2 border-green-500 bg-green-100"></span> 현재 있음</span>
      <span class="flex items-center gap-1"><span class="text-gray-400 text-xs">나감</span> = 퇴실</span>
      <span class="flex items-center gap-1"><span class="text-gray-500 text-xs">[번호]</span> = 지정석·칸막이·프리미엄</span>
      <span class="flex items-center gap-1"><span class="text-orange-500 text-xs font-bold">[번호]</span> = 자유석</span>
      <span class="flex items-center gap-1"><span class="text-purple-500 text-xs font-bold">[집중N]</span> = 집중실</span>
      <span class="text-xs text-slate-400">좌석 정보는 명단 시트의 좌석타입·좌석번호에서 읽습니다</span>
    </div>

    <div id="result"></div>
  </div>

  <script>
  /* ================= 설정 ================= */
  const SPREADSHEET_ID = '1OVEffnCRTZ1A-cVCb4CYiYe3MicyI9TSkJNsau4mGVo';
  const SHEET_GIDS = { floor7: '488759198', floor8: '668013966' };   // 7층전체학생명단 / 8층전체학생명단
  const ACCEPT = '.csv,.tsv,.txt,.xlsx,.xlsm,.xlsb,.xls,.ods,.png,.jpg,.jpeg,.webp,.bmp';

  /* ================= 상태 ================= */
  let roster = { floor7: [], floor8: [] };
  let seatMap = { floor7: {}, floor8: {} };
  let focusRoomSeats = {};
  let freeSeatMap = {};
  let submission = { submitted: new Set(), parentApproved: new Set(), supervisorApproved: new Set() };
  let attendance = { floor7: { present: [], exited: [] }, floor8: { present: [], exited: [] } };

  let attSource = { 7: null, 8: null };   // { file, info, sheets:[{name, rows, width}] }
  let attMap = { 7: null, 8: null };      // { sheetName, headerRow, name, dir, time }
  let attResult = { 7: null, 8: null };
  let attPanelOpen = { 7: false, 8: false };
  let attNewestFirst = { 7: false, 8: false };
  let dirRules = {};                      // 사용자가 지정한 방향값 (양 층 공유)
  let diag = {};
  let copiedText = '';

  const BOXES = {
    sub:   { icon: '📁', title: '수능선배',    hint: '제출 현황' },
    att8:  { icon: '🏢', title: '8층 출석',    hint: '출입 기록' },
    att7:  { icon: '🏢', title: '7층 출석',    hint: '출입 기록' },
    focus: { icon: '🎯', title: '집중실',      hint: '좌석 배치 (엑셀·이미지)' },
    free:  { icon: '🪑', title: '좌석 덮어쓰기', hint: '선택 · 엑셀 또는 배치도 이미지' }
  };

  /* ============================================================
     1. 범용 파일 리더
     ============================================================ */
  function looksBinary(b) {
    if (b.length < 4) return false;
    if (b[0] === 0x50 && b[1] === 0x4b) return true;                                  // zip: xlsx/xlsm/xlsb/ods
    if (b[0] === 0xd0 && b[1] === 0xcf && b[2] === 0x11 && b[3] === 0xe0) return true; // OLE: xls
    if (b[0] === 0x09 && (b[1] === 0x00 || b[1] === 0x02 || b[1] === 0x04)) return true;
    return false;
  }

  function decodeText(bytes) {
    if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf)
      return { text: new TextDecoder('utf-8').decode(bytes.subarray(3)), encoding: 'UTF-8 (BOM)' };
    if (bytes[0] === 0xff && bytes[1] === 0xfe) return { text: new TextDecoder('utf-16le').decode(bytes), encoding: 'UTF-16LE' };
    if (bytes[0] === 0xfe && bytes[1] === 0xff) return { text: new TextDecoder('utf-16be').decode(bytes), encoding: 'UTF-16BE' };

    let utf8 = null;
    try { utf8 = new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) {}
    if (utf8 !== null && !utf8.includes('\ufffd')) return { text: utf8, encoding: 'UTF-8' };

    for (const label of ['euc-kr', 'windows-949', 'iso-8859-1']) {
      try {
        const t = new TextDecoder(label).decode(bytes);
        if (!t.includes('\ufffd')) return { text: t, encoding: label.toUpperCase() };
      } catch (e) {}
    }
    return { text: utf8 !== null ? utf8 : new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8 (일부 깨짐)' };
  }

  function guessDelimiter(text) {
    const sample = text.split(/\r?\n/).slice(0, 20).join('\n');
    let best = ',', bestCount = -1;
    [',', '\t', ';', '|'].forEach(ch => {
      const n = sample.split(ch).length - 1;
      if (n > bestCount) { bestCount = n; best = ch; }
    });
    return best;
  }

  async function readAnyFile(file, prefetched) {
    const bytes = prefetched || new Uint8Array(await file.arrayBuffer());
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    const textExt = ['csv', 'tsv', 'txt', 'psv', 'prn', 'xml', 'html', 'htm'].includes(ext);

    if (!textExt && looksBinary(bytes)) {
      return {
        workbook: XLSX.read(bytes, { type: 'array', cellDates: true }),
        info: { format: ext ? ext.toUpperCase() : '엑셀', encoding: '바이너리' }
      };
    }
    const { text, encoding } = decodeText(bytes);
    const FS = guessDelimiter(text);
    return {
      workbook: XLSX.read(text, { type: 'string', cellDates: true, FS }),
      info: { format: (ext || 'TEXT').toUpperCase(), encoding, delimiter: FS === '\t' ? 'TAB' : FS }
    };
  }

  function sheetRows(sheet) {
    return XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '', cellDates: true });
  }
  function workbookSheets(wb) {
    return wb.SheetNames.map(name => {
      const rows = sheetRows(wb.Sheets[name]);
      return { name, rows, width: Math.max(0, ...rows.map(r => (r || []).length)) };
    });
  }

  /* ============================================================
     2. 공통 유틸
     ============================================================ */
  function normHeader(v) {
    return (v == null ? '' : v.toString()).replace(/[\s\u00a0_\-.()[\]]/g, '').toLowerCase();
  }
  // 괄호·공백만 제거하고 숫자는 남긴다 (정예빈2 처럼 동명이인 구분 숫자가 이름의 일부이므로)
  function cleanName(v) {
    return (v == null ? '' : v.toString())
      .replace(/\(.*?\)/g, '').replace(/\[.*?\]/g, '')
      .replace(/[\s\u00a0]/g, '').trim();
  }
  // 명단과 출석 파일을 맞추기 위한 키 (한글 + 뒤에 붙은 구분 숫자)
  function matchKey(v) {
    const s = cleanName(v);
    const m = s.match(/([가-힣]+)(\d{0,2})/);
    return m ? m[1] + m[2] : s.toLowerCase();
  }
  function isPersonName(v) {
    const s = cleanName(v);
    if (!s || s.length > 12) return false;
    if (/^[가-힣]{2,5}\d{0,2}$/.test(s)) return true;
    return /^[A-Za-z][A-Za-z.\-' ]{1,19}$/.test(s);
  }
  function colLabel(i) {
    let s = '';
    i = i + 1;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }
  function esc(v) {
    return (v == null ? '' : v.toString()).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const KEYS = {
    name:   ['이름', '성명', '회원명', '학생명', '사용자', '사용자명', '이용자', '이용자명', '대상자', '대상자명', 'name', 'username', 'student'],
    dir:    ['방향', '출입방향', '입출구분', '출입구분', '입출력', '구분', '출입', '유형', '인증구분', '출입유형', '상태', 'direction', 'inout', 'type', 'gubun'],
    time:   ['시간', '일시', '시각', '출입시간', '인증시간', '등록일', '등록일시', '발생일', '발생일시', 'datetime', 'time', 'date', 'timestamp'],
    status: ['승인상태', '상태', '진행상태', '승인', '처리상태', 'status'],
    seat:   ['좌석번호', '좌석', '자리', '자리번호', '번호', '석번호', 'seat', 'seatno']
  };

  function findHeader(rows, required, optional = [], maxScan = 25) {
    for (let i = 0; i < Math.min(rows.length, maxScan); i++) {
      const r = rows[i] || [];
      const cols = {};
      let ok = true;
      for (const f of required) {
        const idx = r.findIndex(c => KEYS[f].includes(normHeader(c)));
        if (idx === -1) { ok = false; break; }
        cols[f] = idx;
      }
      if (!ok) continue;
      for (const f of optional) {
        const idx = r.findIndex(c => KEYS[f].some(k => normHeader(c).includes(k)));
        if (idx !== -1) cols[f] = idx;
      }
      return { headerRow: i, cols };
    }
    return null;
  }

  function bestSheet(sheets, parseFn) {
    let best = null;
    sheets.forEach(s => {
      let r;
      try { r = parseFn(s.rows, s.name); } catch (e) { return; }
      if (r && (!best || r.count > best.count)) best = r;
    });
    return best;
  }

  /* ============================================================
     3. 출석: 방향 / 시각 해석
     ============================================================ */
  // 방향값 비교용: 구분자를 남겨 단어 경계를 살린다 (IN-DOOR / OUT_DOOR 대응)
  function dirText(v) {
    return (v == null ? '' : v.toString()).trim().toLowerCase().replace(/\s+/g, ' ');
  }
  const NOT_DIR = /^(invalid|inactive|info|index|internal|outer|output|outline)/;

  function parseDirection(v, allowNumeric = false) {
    const s = normHeader(v);
    if (!s) return null;
    if (dirRules[s]) return dirRules[s];

    const w = dirText(v);
    if (/\bout\b|exit|퇴실|퇴장|퇴근|출구|나감|하원|외출|귀가|반출/.test(w) || /^(out|o|퇴|x)$/.test(s)) return 'EXIT';
    if (/\bin\b|enter|entry|입실|입장|출근|입구|등원|들어|반입/.test(w) || /^(in|i|입)$/.test(s)) return 'ENTER';
    if (w.length <= 12 && !NOT_DIR.test(w)) {
      if (/^out/.test(w)) return 'EXIT';
      if (/^in/.test(w)) return 'ENTER';
    }
    if (allowNumeric) {
      if (s === '1') return 'ENTER';
      if (s === '2' || s === '0') return 'EXIT';
    }
    return null;
  }

  function parseTime(v) {
    if (v == null || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : v.getTime();

    let s;
    if (typeof v === 'number') {
      if (v >= 19000101 && v <= 29991231 && Number.isInteger(v)) s = String(v);
      else return Math.round((v - 25569) * 86400000);
    } else s = v.toString().trim();
    if (!s) return null;

    const isPM = /(오후|PM|p\.?m\.?)/i.test(s);
    const isAM = /(오전|AM|a\.?m\.?)/i.test(s);

    let y, mo, d;
    let m = s.match(/(\d{4})\s*[-/.년]\s*(\d{1,2})\s*[-/.월]\s*(\d{1,2})/);
    if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    if (!m) { m = s.match(/(\d{1,2})\s*[-/.]\s*(\d{1,2})\s*[-/.]\s*(\d{4})/); if (m) { y = +m[3]; mo = +m[1]; d = +m[2]; } }
    if (!m) { m = s.match(/(?:^|\D)(\d{4})(\d{2})(\d{2})(?:\D|$)/); if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; } }

    let t = s.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})(?:\s*[:분]\s*(\d{1,2}))?/);
    if (!t) {
      const rest = m ? s.replace(m[0], ' ') : s;
      const ct = rest.match(/(?:^|\D)([01]\d|2[0-3])([0-5]\d)([0-5]\d)?(?:\D|$)/);
      if (ct) t = ct;
    }
    let h = t ? +t[1] : 0;
    const mi = t && t[2] != null ? +t[2] : 0;
    const sec = t && t[3] != null ? +t[3] : 0;
    if (isPM && h < 12) h += 12;
    if (isAM && h === 12) h = 0;

    if (m) {
      if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
      const dt = new Date(y, mo - 1, d, h, mi, sec);
      return isNaN(dt) ? null : dt.getTime();
    }
    if (t) return ((h * 60 + mi) * 60 + sec) * 1000;
    return null;
  }

  /* ============================================================
     4. 출석: 자동 열 탐지 → 레코드 추출 → 최종 상태
     ============================================================ */
  function autoDetectColumns(rows) {
    const found = findHeader(rows, ['name', 'dir'], ['time']);
    if (found) return { headerRow: found.headerRow, name: found.cols.name, dir: found.cols.dir, time: found.cols.time ?? null };

    const scan = rows.slice(0, Math.min(rows.length, 120));
    const width = Math.max(0, ...scan.map(r => (r || []).length));
    let nameCol = -1, nameHit = 0, dirCol = -1, dirHit = 0;
    for (let c = 0; c < width; c++) {
      let n = 0, d = 0;
      scan.forEach(r => {
        const v = (r || [])[c];
        if (isPersonName(v)) n++;
        if (parseDirection(v, false)) d++;
      });
      if (n > nameHit) { nameHit = n; nameCol = c; }
      if (d > dirHit) { dirHit = d; dirCol = c; }
    }
    if (nameHit < 2 || dirHit < 2 || nameCol === dirCol || dirHit < nameHit * 0.6) return null;

    let timeCol = null;
    for (let c = 0; c < width; c++) {
      if (c === nameCol || c === dirCol) continue;
      if (scan.filter(r => parseTime((r || [])[c])).length >= 2) { timeCol = c; break; }
    }
    return { headerRow: -2, name: nameCol, dir: dirCol, time: timeCol };
  }

  function extractRecords(rows, map) {
    const out = { records: [], dirValues: [], nameRows: 0, unmapped: [] };
    if (!map || map.name == null) return out;
    const start = map.headerRow >= 0 ? map.headerRow + 1 : 0;
    const dirCount = {};
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      const raw = r[map.name];
      if (!isPersonName(raw)) continue;
      out.nameRows++;
      const rawDir = map.dir == null ? '' : r[map.dir];
      const label = (rawDir == null ? '' : rawDir.toString()).trim();
      if (label) dirCount[label] = (dirCount[label] || 0) + 1;
      const dir = parseDirection(rawDir, map.headerRow >= 0);
      if (!dir) continue;
      out.records.push({
        key: matchKey(raw),
        dir,
        time: map.time == null ? null : parseTime(r[map.time]),
        idx: i
      });
    }
    out.dirValues = Object.entries(dirCount).sort((a, b) => b[1] - a[1]).slice(0, 24);
    out.unmapped = out.dirValues.filter(([v]) => !parseDirection(v, map.headerRow >= 0));
    return out;
  }

  function foldRecords(records, newestFirst) {
    const hasTime = records.some(r => r.time != null);
    const sorted = [...records];
    if (hasTime) sorted.sort((a, b) => (a.time ?? -Infinity) - (b.time ?? -Infinity) || a.idx - b.idx);
    else sorted.sort((a, b) => newestFirst ? b.idx - a.idx : a.idx - b.idx);
    const last = {};
    sorted.forEach(r => { last[r.key] = r.dir; });
    return {
      present: Object.keys(last).filter(k => last[k] === 'ENTER'),
      exited: Object.keys(last).filter(k => last[k] === 'EXIT'),
      hasTime
    };
  }

  function sheetByName(floor, name) {
    const src = attSource[floor];
    if (!src) return null;
    return src.sheets.find(s => s.name === name) || src.sheets[0] || null;
  }

  function autoMapFor(floor) {
    const src = attSource[floor];
    if (!src) return null;
    let best = null;
    src.sheets.forEach(s => {
      const cols = autoDetectColumns(s.rows);
      if (!cols) return;
      const r = extractRecords(s.rows, cols);
      if (!best || r.records.length > best.count) best = { map: Object.assign({ sheetName: s.name }, cols), count: r.records.length };
    });
    return best ? best.map : null;
  }

  function resolveAttendance(floor) {
    const src = attSource[floor];
    if (!src) return;
    if (!attMap[floor]) {
      attMap[floor] = autoMapFor(floor)
        || { sheetName: (src.sheets[0] || {}).name, headerRow: -2, name: null, dir: null, time: null };
    }

    const map = attMap[floor];
    const sheet = map ? sheetByName(floor, map.sheetName) : src.sheets[0];
    const rows = sheet ? sheet.rows : [];
    const ext = map ? extractRecords(rows, map) : { records: [], dirValues: [], nameRows: 0, unmapped: [] };
    const folded = foldRecords(ext.records, attNewestFirst[floor]);

    attendance[floor === 7 ? 'floor7' : 'floor8'] = { present: folded.present, exited: folded.exited };
    attResult[floor] = { map, sheet, ext, folded };

    const ok = ext.records.length > 0;
    const kind = 'att' + floor;
    const dataRows = rows.length - Math.max(0, map ? map.headerRow : 0) - (map && map.headerRow >= 0 ? 1 : 0);
    let reason = '';
    if (!ok) {
      if (rows.length === 0) reason = '파일이 비어 있습니다.';
      else if (dataRows <= 0) reason = `데이터 행이 없습니다 — 이 파일에는 헤더 ${rows.length}행만 있습니다. 내보내기 조회 조건(날짜·층)을 확인하고 다시 내려받아 주세요.`;
      else if (!map || map.name == null || map.dir == null) reason = '이름·방향 열을 자동으로 찾지 못했습니다';
      else if (ext.nameRows === 0) reason = `선택한 이름 열(${colLabel(map.name)}열)에 이름이 없습니다 — 다른 열을 지정해 보세요`;
      else reason = '방향 값을 해석할 수 없습니다 (아래에서 값의 뜻을 지정하세요)';
      attPanelOpen[floor] = true;
    }
    diag[kind] = Object.assign({}, diag[kind], { ok, reason });
    setBox(kind, ok ? 'ok' : 'warn', ok ? `${folded.present.length}명 있음 / ${folded.exited.length}명 나감` : '설정 필요');
    renderDiag();
    render();
  }

  /* ============================================================
     5. 매핑 UI
     ============================================================ */
  function setMapField(floor, field, value) {
    const map = Object.assign({}, attMap[floor]);
    if (field === 'sheetName') {
      const sheet = sheetByName(floor, value);
      const cols = sheet ? autoDetectColumns(sheet.rows) : null;
      attMap[floor] = Object.assign({ sheetName: value, headerRow: -2, name: null, dir: null, time: null }, cols || {}, { sheetName: value });
    } else {
      map[field] = value;
      attMap[floor] = map;
    }
    resolveAttendance(floor);
  }

  function setDirRule(floor, valueKey, dir) {
    if (dir) dirRules[valueKey] = dir; else delete dirRules[valueKey];
    resolveAttendance(7);
    resolveAttendance(8);
  }

  function togglePanel(floor) {
    attPanelOpen[floor] = !attPanelOpen[floor];
    renderDiag();
  }

  function toggleOrder(floor) {
    attNewestFirst[floor] = !attNewestFirst[floor];
    resolveAttendance(floor);
  }

  function colOptions(floor, selected, includeNone) {
    const res = attResult[floor];
    const sheet = res && res.sheet;
    if (!sheet) return '';
    const map = attMap[floor] || {};
    const headerRow = map.headerRow >= 0 ? (sheet.rows[map.headerRow] || []) : null;
    const sample = [];
    for (let c = 0; c < sheet.width; c++) {
      let label = colLabel(c);
      if (headerRow && headerRow[c] !== '' && headerRow[c] != null) label += ': ' + headerRow[c];
      else {
        const start = map.headerRow >= 0 ? map.headerRow + 1 : 0;
        const first = (sheet.rows.slice(start, start + 30).find(r => (r || [])[c] !== '' && (r || [])[c] != null) || [])[c];
        if (first != null && first !== '') label += ': ' + String(first).slice(0, 12);
      }
      sample.push(`<option value="${c}" ${String(selected) === String(c) ? 'selected' : ''}>${esc(label)}</option>`);
    }
    return (includeNone ? `<option value="" ${selected == null ? 'selected' : ''}>없음</option>` : '') + sample.join('');
  }

  function mapPanel(floor) {
    const src = attSource[floor];
    const res = attResult[floor];
    if (!src || !res) return '';
    if (!attPanelOpen[floor]) {
      return `<button onclick="togglePanel(${floor})" class="text-blue-600 underline text-xs">🔧 열 직접 지정</button>`;
    }
    const map = attMap[floor] || { headerRow: -2, name: null, dir: null, time: null, sheetName: src.sheets[0] && src.sheets[0].name };
    const sheet = res.sheet;

    const sheetOpts = src.sheets.map(s =>
      `<option value="${esc(s.name)}" ${s.name === (sheet && sheet.name) ? 'selected' : ''}>${esc(s.name)} (${s.rows.length}행)</option>`).join('');

    const headerOpts = [`<option value="-2" ${map.headerRow < 0 ? 'selected' : ''}>헤더 없음</option>`]
      .concat((sheet ? sheet.rows.slice(0, 15) : []).map((r, i) =>
        `<option value="${i}" ${map.headerRow === i ? 'selected' : ''}>${i + 1}행: ${esc((r || []).slice(0, 4).join(' | ')).slice(0, 40)}</option>`)).join('');

    const values = res.ext.dirValues.map(([v, n]) => {
      const key = normHeader(v);
      const cur = parseDirection(v, map.headerRow >= 0);
      const btn = (label, dir, cls) =>
        `<button onclick="setDirRule(${floor}, '${esc(key)}', ${dir ? `'${dir}'` : 'null'})"
          class="px-1.5 py-0.5 rounded border text-[11px] ${cur === dir || (!dir && !cur) ? cls : 'bg-white text-slate-500 border-slate-300'}">${label}</button>`;
      return `<div class="flex items-center gap-1 bg-white rounded border px-2 py-1">
        <code class="text-[11px]">${esc(v)}</code><span class="text-[10px] text-slate-400">×${n}</span>
        ${btn('입실', 'ENTER', 'bg-green-100 text-green-700 border-green-400')}
        ${btn('퇴실', 'EXIT', 'bg-orange-100 text-orange-700 border-orange-400')}
        ${btn('무시', null, 'bg-slate-200 text-slate-600 border-slate-400')}
      </div>`;
    }).join('');

    const peek = (sheet ? sheet.rows.slice(0, 3) : []).map((r, i) =>
      `<div class="truncate"><span class="text-slate-400">${i + 1}행:</span> ${(r || []).slice(0, 10).map(c => `<code class="bg-white px-1 rounded border">${esc(c === '' ? '·' : c)}</code>`).join(' ')}</div>`).join('');

    return `
      <div class="mt-2 bg-slate-50 rounded-lg p-3 space-y-2 text-xs">
        <div class="flex items-center justify-between">
          <span class="font-bold text-slate-700">${floor}층 출석 파일 열 지정</span>
          <button onclick="togglePanel(${floor})" class="text-slate-400 hover:text-slate-600">닫기 ✕</button>
        </div>
        <div class="space-y-1 text-slate-500">${peek}</div>
        <div class="flex flex-wrap gap-x-3 gap-y-2 items-center">
          <label>시트 <select onchange="setMapField(${floor},'sheetName',this.value)">${sheetOpts}</select></label>
          <label>헤더 <select onchange="setMapField(${floor},'headerRow',+this.value)">${headerOpts}</select></label>
          <label>이름 열 <select onchange="setMapField(${floor},'name',+this.value)">${colOptions(floor, map.name, true)}</select></label>
          <label>방향 열 <select onchange="setMapField(${floor},'dir',+this.value)">${colOptions(floor, map.dir, true)}</select></label>
          <label>시간 열 <select onchange="setMapField(${floor},'time',this.value===''?null:+this.value)">${colOptions(floor, map.time, true)}</select></label>
        </div>
        ${values ? `<div><div class="mb-1 text-slate-600">방향 열의 값 (${res.ext.unmapped.length ? '빨간 표시가 없는 값은 무시됩니다' : '자동 인식됨'})</div>
          <div class="flex flex-wrap gap-1">${values}</div></div>`
        : '<div class="text-slate-500">방향 열을 선택하면 값 목록이 표시됩니다.</div>'}
        <div class="text-slate-400">이름 인식 ${res.ext.nameRows}행 · 방향 인식 ${res.ext.records.length}건</div>
      </div>`;
  }

  /* ============================================================
     6-A. 좌석 배치도 이미지 → OCR → 명단 교정 → 검토
     ============================================================ */
  const SEAT_RANGE = { free: [1, 200], focus: [1, 200] };   // 배치도 이미지에서 인식할 좌석번호 범위
  let ocrReview = null;   // { target, rows, busy, note }
  let tessPromise = null;

  function isImageFile(file) {
    return (file.type && file.type.startsWith('image/')) || /\.(png|jpe?g|webp|bmp|gif|heic|heif)$/i.test(file.name || '');
  }
  // 확장자·MIME이 없거나 잘못된 경우를 대비해 파일 시그니처로 판별
  function imageSignature(b) {
    if (b.length < 12) return null;
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'PNG';
    if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return 'JPEG';
    if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) return 'GIF';
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46
        && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'WEBP';
    return null;
  }

  function loadTesseract() {
    if (tessPromise) return tessPromise;
    tessPromise = new Promise((resolve, reject) => {
      if (window.Tesseract) return resolve(window.Tesseract);
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
      s.onload = () => resolve(window.Tesseract);
      s.onerror = () => reject(new Error('OCR 엔진(tesseract.js)을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'));
      document.head.appendChild(s);
    });
    return tessPromise;
  }

  // 인식 결과에서 단어 단위 토큰을 꺼낸다 (tesseract.js 버전에 따라 위치가 다름)
  function ocrWords(data) {
    let words = data.words && data.words.length ? data.words : [];
    if (!words.length) {
      (data.blocks || []).forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => {
        (l.words || []).forEach(w => words.push(w));
      })));
    }
    return words
      .filter(w => w.text && w.text.trim() && w.confidence > 0)
      .map(w => ({
        text: w.text.trim().replace(/^['"`,.|_\-]+|['"`,.|_\-]+$/g, ''),
        conf: w.confidence,
        x: w.bbox.x0, y: w.bbox.y0, w: w.bbox.x1 - w.bbox.x0, h: w.bbox.y1 - w.bbox.y0
      }))
      .filter(w => w.text);
  }

  // 이름은 한 패스만(중복 글자 방지), 좌석 숫자는 여러 패스로 보완
  const OCR_PASSES = [
    { psm: '11', wl: '',            kind: 'name'  },
    { psm: '11', wl: '0123456789',  kind: 'digit' },
    { psm: '6',  wl: '0123456789',  kind: 'digit' },
    { psm: '4',  wl: '0123456789',  kind: 'digit' }
  ];

  async function runOcr(file, onStep) {
    const T = await loadTesseract();
    const url = URL.createObjectURL(file);
    const worker = await T.createWorker('kor+eng', 1);
    try {
      const res = { name: [], digit: [] };
      for (let i = 0; i < OCR_PASSES.length; i++) {
        const p = OCR_PASSES[i];
        onStep(`${i + 1}/${OCR_PASSES.length} 단계 인식 중`);
        await worker.setParameters({ tessedit_pageseg_mode: p.psm, tessedit_char_whitelist: p.wl });
        const { data } = await worker.recognize(url);
        res[p.kind] = res[p.kind].concat(ocrWords(data));
      }
      return res;
    } finally {
      try { await worker.terminate(); } catch (e) {}
      URL.revokeObjectURL(url);
    }
  }

  const boxArea = t => t.w * t.h;
  function overlaps(a, b) {
    return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) > 0
        && Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) > 0;
  }
  function dedupeBoxes(toks) {
    const keep = [];
    for (const t of [...toks].sort((a, b) => b.conf - a.conf)) {
      const dup = keep.some(k => {
        const ox = Math.min(t.x + t.w, k.x + k.w) - Math.max(t.x, k.x);
        const oy = Math.min(t.y + t.h, k.y + k.h) - Math.max(t.y, k.y);
        return ox > 0 && oy > 0 && ox * oy > 0.5 * Math.min(boxArea(t), boxArea(k));
      });
      if (!dup) keep.push(t);
    }
    return keep;
  }

  // 좌석 번호 바로 아래에 있는 글자 조각들을 x 순으로 이어붙여 이름을 만든다
  function pairSeatsWithNames(tokens, range) {
    const [lo, hi] = range;
    const seats = dedupeBoxes(tokens.digit.filter(t => /^\d+$/.test(t.text) && +t.text >= lo && +t.text <= hi));
    let pieces = dedupeBoxes(tokens.name.filter(t => /[가-힣]/.test(t.text) || /^\d{1,2}$/.test(t.text)));
    pieces = pieces.filter(p => !seats.some(s => overlaps(p, s)));

    const out = [];
    seats.forEach(s => {
      const sh = s.h;
      const cand = pieces.filter(p =>
        p.y > s.y + sh * 0.2 && p.y < s.y + sh * 3.5 &&
        Math.min(p.x + p.w, s.x + s.w + sh * 1.6) - Math.max(p.x, s.x - sh * 1.6) > 0);
      if (!cand.length) return;
      const y0 = Math.min(...cand.map(p => p.y));
      const line = cand.filter(p => Math.abs(p.y - y0) <= sh).sort((a, b) => a.x - b.x);
      const text = line.map(p => p.text).join('');
      if (text) out.push({ seat: +s.text, raw: text, conf: Math.round(Math.min(...line.map(p => p.conf))) });
    });
    return out.sort((a, b) => a.seat - b.seat);
  }

  // 연속 중복 글자 제거 + 한글/숫자만 남김 (원원종종현현 → 원종현, "남주:" → 남주)
  function ocrNorm(s) {
    let o = '';
    for (const c of String(s)) {
      if (/[가-힣0-9]/.test(c) && o[o.length - 1] !== c) o += c;
    }
    return o;
  }
  function levenshtein(a, b) {
    if (a === b) return 0;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) {
        cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] !== b[j - 1] ? 1 : 0)));
      }
      prev = cur;
    }
    return prev[b.length];
  }
  // OCR 결과를 명단에서 가장 가까운 이름으로 교정
  function correctToRoster(raw, names) {
    const n = ocrNorm(raw);
    if (!n) return { name: '', dist: 99, status: 'empty' };
    if (!names.length) return { name: n, dist: 0, status: 'noroster' };
    let best = null, second = null;
    names.forEach(r => {
      const d = levenshtein(n, r);
      if (!best || d < best.d) { second = best; best = { d, r }; }
      else if (!second || d < second.d) second = { d, r };
    });
    const tie = second && second.d === best.d;
    if (best.d === 0) return { name: best.r, dist: 0, status: 'exact' };
    if (best.d <= 1 && !tie) return { name: best.r, dist: best.d, status: 'fixed' };
    return { name: best.r, dist: best.d, status: 'check', tie: !!tie };
  }

  async function handleSeatImage(kind, file) {
    const target = kind === 'focus' ? 'focus' : 'free';
    ocrReview = { target, rows: [], busy: '이미지 준비 중', note: file.name };
    renderOcrReview();
    setBox(kind, 'loading', '이미지 인식 중…');
    try {
      const tokens = await runOcr(file, msg => { ocrReview.busy = msg; renderOcrReview(); });
      const names = roster.floor7.concat(roster.floor8);
      const found = pairSeatsWithNames(tokens, SEAT_RANGE[target]);

      const rows = found.map(f => {
        const c = correctToRoster(f.raw, names);
        return { seat: f.seat, raw: f.raw, name: c.name, conf: f.conf, status: c.status, dist: c.dist };
      });
      // 같은 이름이 두 좌석에 배정되면 둘 다 확인 대상
      const seen = {};
      rows.forEach(r => { if (r.name) (seen[r.name] = seen[r.name] || []).push(r); });
      Object.values(seen).forEach(g => { if (g.length > 1) g.forEach(r => { r.status = 'dup'; }); });

      ocrReview = { target, rows, busy: null, note: file.name, rosterSize: names.length };
      renderOcrReview();
      const need = rows.filter(r => r.status === 'check' || r.status === 'dup' || !r.name).length;
      setBox(kind, need ? 'warn' : 'ok', `${rows.length}석 인식 · 확인 필요 ${need}건`);
      diag[kind] = { file: file.name, info: { format: '이미지 OCR' }, ok: !need,
        summary: `${rows.length}석 인식 · 자동 확정 ${rows.length - need}건`,
        reason: need ? `${need}건은 아래에서 확인해 주세요` : '' };
      renderDiag();
    } catch (err) {
      ocrReview = { target, rows: [], busy: null, error: err.message, note: file.name };
      renderOcrReview();
      setBox(kind, 'warn', 'OCR 실패');
    }
  }

  function setReviewName(i, value) {
    ocrReview.rows[i].name = value;
    ocrReview.rows[i].status = value ? 'manual' : 'empty';
    renderOcrReview();
  }
  function addReviewRow() {
    ocrReview.rows.push({ seat: '', raw: '(직접 추가)', name: '', conf: 0, status: 'empty' });
    renderOcrReview();
  }
  function setReviewSeat(i, value) {
    ocrReview.rows[i].seat = parseInt(value, 10) || '';
    renderOcrReview();
  }
  function removeReviewRow(i) {
    ocrReview.rows.splice(i, 1);
    renderOcrReview();
  }
  function applyReview() {
    const [lo, hi] = SEAT_RANGE[ocrReview.target];
    const map = {};
    ocrReview.rows.forEach(r => {
      const seat = parseInt(r.seat, 10);
      if (!r.name || !seat || seat < lo || seat > hi) return;
      map[matchKey(r.name)] = seat;
    });
    if (ocrReview.target === 'focus') {
      focusRoomSeats = map;
      setBox('focus', 'ok', `${Object.keys(map).length}명 배치`);
    } else {
      freeSeatMap = map;
      setBox('free', 'ok', `${Object.keys(map).length}명 로드 완료`);
      document.getElementById('freeSeatResult').innerHTML = `
        <div class="bg-orange-50 rounded-lg p-3 text-sm">
          <div class="font-bold mb-2 text-orange-700">🪑 자유석 (${Object.keys(map).length}명)</div>
          <div class="flex flex-wrap gap-2">
            ${Object.entries(map).sort((a, b) => a[1] - b[1])
              .map(([n, s]) => `<span class="px-2 py-1 bg-white rounded border text-xs">[${s}] ${esc(n)}</span>`).join('')}
          </div></div>`;
    }
    ocrReview = null;
    renderOcrReview();
    render();
  }

  const REVIEW_TONE = {
    exact:    ['bg-green-50', '명단 일치'],
    fixed:    ['bg-blue-50', '명단으로 교정'],
    manual:   ['bg-slate-50', '직접 선택'],
    noroster: ['bg-slate-50', '명단 없음'],
    check:    ['bg-red-50', '확인 필요'],
    dup:      ['bg-red-50', '이름 중복'],
    empty:    ['bg-red-50', '인식 실패']
  };

  function renderOcrReview() {
    const el = document.getElementById('ocrReview');
    if (!el) return;
    if (!ocrReview) { el.innerHTML = ''; return; }
    if (ocrReview.error) {
      el.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-3 text-sm text-red-700">⚠️ ${esc(ocrReview.error)}</div>`;
      return;
    }
    if (ocrReview.busy) {
      el.innerHTML = `<div class="bg-white rounded-xl p-4 text-sm text-slate-600 text-center">
        🔍 ${esc(ocrReview.note)} — ${esc(ocrReview.busy)}
        <div class="text-xs text-slate-400 mt-1">처음 실행할 때는 한글 인식 모델을 내려받아 10초 이상 걸릴 수 있습니다</div></div>`;
      return;
    }

    const names = roster.floor7.concat(roster.floor8);
    const need = ocrReview.rows.filter(r => ['check', 'dup', 'empty'].includes(r.status)).length;

    // 검출된 좌석 범위 안에서 아무 것도 잡히지 않은 번호 — 빈 좌석일 수도, 인식 실패일 수도 있다
    const nums = ocrReview.rows.map(r => parseInt(r.seat, 10)).filter(n => n);
    let missing = [];
    if (nums.length) {
      for (let n = Math.min(...nums); n <= Math.max(...nums); n++) if (!nums.includes(n)) missing.push(n);
    }
    const missingNote = missing.length ? `
      <div class="bg-amber-50 border border-amber-200 rounded p-2 mb-2 text-amber-800">
        이 번호는 이름이 잡히지 않았습니다: <b>${missing.join(', ')}</b><br>
        원래 빈 좌석이면 그대로 두시고, 배정된 학생이 있으면 "+ 좌석 추가"로 넣어주세요.
      </div>` : '';

    const rows = ocrReview.rows.map((r, i) => {
      const [bg, label] = REVIEW_TONE[r.status] || REVIEW_TONE.check;
      const opts = [`<option value="">(비움)</option>`]
        .concat(names.map(n => `<option value="${esc(n)}" ${n === r.name ? 'selected' : ''}>${esc(n)}</option>`));
      if (r.name && !names.includes(r.name)) opts.splice(1, 0, `<option value="${esc(r.name)}" selected>${esc(r.name)} (명단 외)</option>`);
      return `<tr class="${bg}">
        <td class="px-2 py-1"><input type="number" value="${r.seat}" onchange="setReviewSeat(${i}, this.value)"
             class="w-16 border rounded px-1 py-0.5 text-center"></td>
        <td class="px-2 py-1 text-slate-500"><code>${esc(r.raw)}</code>${r.conf ? ` <span class="text-[10px] text-slate-400">${r.conf}%</span>` : ''}</td>
        <td class="px-2 py-1"><select onchange="setReviewName(${i}, this.value)">${opts.join('')}</select></td>
        <td class="px-2 py-1 text-[11px] text-slate-500">${label}${r.dist > 0 && r.dist < 99 ? ` (${r.dist}자 차이)` : ''}</td>
        <td class="px-2 py-1"><button onclick="removeReviewRow(${i})" class="text-slate-400 hover:text-red-500">✕</button></td>
      </tr>`;
    }).join('');

    el.innerHTML = `
      <div class="bg-white rounded-xl p-3 text-xs">
        <div class="flex items-center justify-between mb-2">
          <span class="font-bold text-slate-700">
            🔍 ${ocrReview.target === 'focus' ? '집중실' : '자유석'} 배치도 인식 결과 — ${ocrReview.rows.length}석
            ${need ? `<span class="text-red-600">· 확인 필요 ${need}건</span>` : '<span class="text-green-600">· 인식된 이름은 모두 명단과 일치</span>'}
          </span>
          <div class="flex gap-2">
            <button onclick="addReviewRow()" class="px-2 py-1 border rounded hover:bg-slate-50">+ 좌석 추가</button>
            <button onclick="applyReview()" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">적용</button>
          </div>
        </div>
        <div class="text-slate-500 mb-2">OCR은 이름을 잘못 읽을 수 있어 명단 ${ocrReview.rosterSize || 0}명과 대조해 교정했습니다. 빨간 줄과 아래 안내를 확인한 뒤 적용하세요.</div>
        ${missingNote}
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="text-slate-400 text-left"><tr>
              <th class="px-2 py-1">좌석</th><th class="px-2 py-1">OCR 원문</th><th class="px-2 py-1">이름</th><th class="px-2 py-1">상태</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }

  /* ============================================================
     6-B. 파일 처리
     ============================================================ */
  async function handleFile(kind, file) {
    if (!file) return;
    let bytes = null;
    try { bytes = new Uint8Array(await file.arrayBuffer()); } catch (e) {}

    const sig = bytes ? imageSignature(bytes) : null;
    if (isImageFile(file) || sig) {
      if (kind === 'free' || kind === 'focus') return handleSeatImage(kind, file);
      diag[kind] = { file: file.name, ok: false,
        reason: `이미지 파일입니다${sig ? ' (' + sig + ')' : ''} — 이미지 인식은 좌석 배치도(자유석·집중실)에서만 됩니다. 이 항목은 엑셀이나 CSV로 올려주세요.` };
      setBox(kind, 'warn', '이미지 지원 안 함');
      renderDiag();
      return;
    }
    setBox(kind, 'loading', file.name);
    try {
      const { workbook, info } = await readAnyFile(file, bytes);
      const sheets = workbookSheets(workbook);
      diag[kind] = { file: file.name, info };
      HANDLERS[kind](sheets);
    } catch (err) {
      diag[kind] = { file: file.name, ok: false, reason: '파일을 열 수 없습니다: ' + err.message };
      setBox(kind, 'warn', '읽기 실패');
      renderDiag();
    }
  }

  const HANDLERS = {
    att8: sheets => { attSource[8] = { sheets }; attMap[8] = null; resolveAttendance(8); },
    att7: sheets => { attSource[7] = { sheets }; attMap[7] = null; resolveAttendance(7); },

    sub: sheets => {
      const parsed = bestSheet(sheets, (rows, sheetName) => {
        const found = findHeader(rows, ['name', 'status']);
        if (!found) return { count: 0, sheetName, firstRows: rows.slice(0, 3) };
        const res = { submitted: new Set(), parentApproved: new Set(), supervisorApproved: new Set() };
        const statusValues = new Set();
        for (let i = found.headerRow + 1; i < rows.length; i++) {
          const r = rows[i] || [];
          const name = (r[found.cols.name] ?? '').toString().trim();
          const status = (r[found.cols.status] ?? '').toString().trim();
          if (!name || !status) continue;
          statusValues.add(status);
          const s = normHeader(status);
          const key = matchKey(name);
          if (s.includes('사감')) res.supervisorApproved.add(key);
          else if (s.includes('학부모') || s.includes('부모')) res.parentApproved.add(key);
          else if (s.includes('제출')) res.submitted.add(key);
        }
        const count = res.submitted.size + res.parentApproved.size + res.supervisorApproved.size;
        return { count, sheetName, headerRow: found.headerRow, res, statusValues: [...statusValues].slice(0, 10), firstRows: rows.slice(0, 3) };
      });

      if (!parsed || !parsed.count) {
        submission = { submitted: new Set(), parentApproved: new Set(), supervisorApproved: new Set() };
        diag.sub = Object.assign({}, diag.sub, { ok: false, reason: '이름·승인상태 열을 찾지 못했습니다', detail: parsed });
        setBox('sub', 'warn', '열 인식 실패');
      } else {
        submission = parsed.res;
        diag.sub = Object.assign({}, diag.sub, {
          ok: true, detail: parsed,
          summary: `시트 "${parsed.sheetName}" · ${parsed.headerRow + 1}행 헤더 · ${parsed.count}명 · 상태값 ${parsed.statusValues.join(', ')}`
        });
        setBox('sub', 'ok', `${parsed.count}명 제출`);
      }
      renderDiag(); render();
    },

    focus: sheets => {
      const parsed = bestSheet(sheets, (rows, sheetName) => parseNameSeat(rows, sheetName, null));
      focusRoomSeats = {};
      if (parsed && parsed.count) parsed.map.forEach(({ name, seat }) => { focusRoomSeats[name] = seat; });
      const ok = Object.keys(focusRoomSeats).length > 0;
      diag.focus = Object.assign({}, diag.focus, {
        ok, detail: parsed,
        summary: ok ? `시트 "${parsed.sheetName}" · ${parsed.count}명` : '',
        reason: ok ? '' : '이름·좌석번호를 찾지 못했습니다'
      });
      setBox('focus', ok ? 'ok' : 'warn', ok ? `${Object.keys(focusRoomSeats).length}명 배치` : '열 인식 실패');
      renderDiag(); render();
    },

    free: sheets => {
      const parsed = bestSheet(sheets, (rows, sheetName) => parseNameSeat(rows, sheetName, [1, 300]));
      freeSeatMap = {};
      if (parsed && parsed.count) parsed.map.forEach(({ name, seat }) => { freeSeatMap[name] = seat; });
      const count = Object.keys(freeSeatMap).length;
      diag.free = Object.assign({}, diag.free, {
        ok: count > 0, detail: parsed,
        summary: count > 0 ? `시트 "${parsed.sheetName}" · ${count}명${parsed.skipped ? ` · 좌석번호 없는 ${parsed.skipped}행 제외` : ''}` : '',
        reason: count > 0 ? '' : '이름·좌석번호를 찾지 못했습니다'
      });
      setBox('free', count > 0 ? 'ok' : 'warn', count > 0 ? `${count}명 로드 완료` : '열 인식 실패');
      document.getElementById('freeSeatResult').innerHTML = count > 0 ? `
        <div class="bg-orange-50 rounded-lg p-3 text-sm">
          <div class="font-bold mb-2 text-orange-700">🪑 자유석 (${count}명)</div>
          <div class="flex flex-wrap gap-2">
            ${Object.entries(freeSeatMap).sort((a, b) => a[1] - b[1])
              .map(([n, s]) => `<span class="px-2 py-1 bg-white rounded border text-xs">[${s}] ${esc(n)}</span>`).join('')}
          </div></div>` : '';
      renderDiag(); render();
    }
  };

  function parseNameSeat(rows, sheetName, range) {
    const out = { sheetName, count: 0, map: [], skipped: 0, firstRows: rows.slice(0, 3) };
    if (!rows.length) return out;

    let nameCol, seatCol, start;
    const found = findHeader(rows, ['name', 'seat']);
    if (found) {
      nameCol = found.cols.name; seatCol = found.cols.seat; start = found.headerRow + 1;
    } else {
      const scan = rows.slice(0, Math.min(rows.length, 200));
      const width = Math.max(0, ...scan.map(r => (r || []).length));
      let bestN = -1, hitN = 0;
      for (let c = 0; c < width; c++) {
        const n = scan.filter(r => isPersonName((r || [])[c])).length;
        if (n > hitN) { hitN = n; bestN = c; }
      }
      if (hitN < 2) return out;
      let bestS = -1, hitS = 0;
      for (let c = 0; c < width; c++) {
        if (c === bestN) continue;
        const n = scan.filter(r => /\d/.test(((r || [])[c] ?? '').toString())).length;
        if (n > hitS) { hitS = n; bestS = c; }
      }
      if (bestS === -1) return out;
      nameCol = bestN; seatCol = bestS; start = 0;
    }

    const seen = new Set();
    for (let i = start; i < rows.length; i++) {
      const r = rows[i] || [];
      const raw = r[nameCol];
      if (!isPersonName(raw)) continue;
      const name = matchKey(raw);
      if (seen.has(name)) continue;
      const m = (r[seatCol] ?? '').toString().match(/\d+/);
      if (!m) continue;
      const seat = parseInt(m[0], 10);
      if (range && (seat < range[0] || seat > range[1])) { out.skipped++; continue; }
      seen.add(name);
      out.map.push({ name, seat });
    }
    out.count = out.map.length;
    return out;
  }

  /* ============================================================
     7. 업로드 박스 + 드래그 앤 드롭
     ============================================================ */
  const TONE = {
    idle: 'border-dashed border-slate-300 bg-white',
    loading: 'border-slate-400 bg-slate-50',
    ok: 'border-green-400 bg-green-50',
    warn: 'border-red-400 bg-red-50'
  };

  function setBox(kind, state, sub) {
    const b = BOXES[kind];
    const el = document.querySelector(`label[data-kind="${kind}"]`);
    if (!el) return;
    el.className = `block p-3 border-2 rounded-xl cursor-pointer text-center ${TONE[state]}`;
    const icon = state === 'ok' ? '✅' : state === 'warn' ? '⚠️' : state === 'loading' ? '⏳' : b.icon;
    el.innerHTML = `
      <div class="text-base mb-1">${icon} ${b.title}</div>
      <div class="text-xs ${state === 'warn' ? 'text-red-600' : 'text-slate-500'} truncate">${esc(sub ?? b.hint)}</div>
      <input type="file" accept="${ACCEPT}" class="hidden" onchange="handleFile('${kind}', this.files[0])">`;
  }

  function initBoxes() {
    Object.keys(BOXES).forEach(kind => {
      setBox(kind, 'idle');
      const el = document.querySelector(`label[data-kind="${kind}"]`);
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drop-active'); });
      el.addEventListener('dragleave', () => el.classList.remove('drop-active'));
      el.addEventListener('drop', e => {
        e.preventDefault(); el.classList.remove('drop-active');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(kind, e.dataTransfer.files[0]);
      });
    });
  }

  /* ============================================================
     8. 진단 패널
     ============================================================ */
  function renderDiag() {
    const blocks = Object.keys(BOXES).filter(k => diag[k]).map(kind => {
      const d = diag[kind], b = BOXES[kind];
      const meta = d.info ? `${d.info.format}${d.info.encoding ? ' / ' + d.info.encoding : ''}${d.info.delimiter ? ' / 구분자 ' + d.info.delimiter : ''}` : '';
      const head = `<span class="font-bold">${b.title}</span> <span class="text-slate-400">${esc(d.file || '')} ${meta ? '(' + meta + ')' : ''}</span>`;

      if (kind.startsWith('att')) {
        const floor = Number(kind.slice(3));
        const res = attResult[floor];
        let line = '';
        if (res && d.ok) {
          const m = res.map;
          line = `시트 "${res.sheet.name}" · ${m.headerRow >= 0 ? (m.headerRow + 1) + '행 헤더' : '헤더 없음'} · `
            + `이름 ${colLabel(m.name)}열 / 방향 ${colLabel(m.dir)}열${m.time != null ? ' / 시간 ' + colLabel(m.time) + '열' : ''} · `
            + `${res.sheet.rows.length}행 중 ${res.ext.records.length}건 · `
            + (res.folded.hasTime ? '시간 기준 판정'
              : `<button onclick="toggleOrder(${floor})" class="text-blue-600 underline">${attNewestFirst[floor] ? '최신이 위' : '최신이 아래'} (반대로)</button>`);
        } else {
          line = `<span class="text-red-600 font-medium">${esc(d.reason || '인식 실패')}</span>`;
        }
        return `<div class="py-2 text-xs border-b last:border-0 ${d.ok ? 'text-slate-600' : 'text-red-700'}">
          ${head}<br>${line}<div class="mt-1">${mapPanel(floor)}</div></div>`;
      }

      if (d.ok) return `<div class="py-2 text-xs text-slate-600 border-b last:border-0">${head}<br>${esc(d.summary || '')}</div>`;

      const peek = ((d.detail && d.detail.firstRows) || []).map((r, i) =>
        `<div class="truncate"><span class="text-slate-400">${i + 1}행:</span> ${(r || []).slice(0, 10).map(c => `<code class="bg-white px-1 rounded border">${esc(c === '' ? '·' : c)}</code>`).join(' ')}</div>`).join('');
      return `<div class="py-2 text-xs text-red-700 border-b last:border-0">
        <div class="font-bold mb-1">⚠️ ${b.title} — ${esc(d.reason || '읽기 실패')}</div>
        <div class="text-slate-500 mb-1">${esc(d.file || '')} ${meta ? '(' + meta + ')' : ''}</div>
        ${peek ? `<div class="space-y-1">${peek}</div>` : ''}</div>`;
    });
    document.getElementById('diag').innerHTML = blocks.length ? `<div class="bg-white rounded-xl px-4 py-1">${blocks.join('')}</div>` : '';
  }

  /* ============================================================
     9. Google Sheets 명단
     ============================================================ */
  async function loadGoogleSheets() {
    document.getElementById('status').textContent = '⏳ 로딩중...';
    try {
      for (const [key, gid] of [['floor7', SHEET_GIDS.floor7], ['floor8', SHEET_GIDS.floor8]]) {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`);
        const parsed = parseNamesAndSeats(await res.text());
        roster[key] = parsed.names;
        seatMap[key] = parsed.seats;
      }
      const now = new Date().toLocaleTimeString('ko-KR');
      document.getElementById('status').innerHTML = `✅ 7층 ${roster.floor7.length}명, 8층 ${roster.floor8.length}명 <span class="text-slate-400 text-xs">(${now})</span>`;
      render();
    } catch (e) {
      document.getElementById('status').textContent = '❌ 로드 실패: ' + e.message;
    }
  }

  // 명단 시트 파싱 — 헤더 이름으로 열을 찾고, 좌석타입까지 읽는다
  function parseNamesAndSeats(csv) {
    const rows = csv.split(/\r?\n/).filter(l => l.trim()).map(parseCSVRow)
      .map(r => r.map(c => c.replace(/^"|"$/g, '').trim()));

    let head = -1, ci = null;
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      const h = rows[i].map(normHeader);
      const n = h.findIndex(v => v === '이름' || v === '성명');
      const s = h.findIndex(v => v === '좌석번호' || v === '좌석');
      if (n !== -1 && s !== -1) {
        head = i;
        ci = { name: n, seat: s, type: h.findIndex(v => v === '좌석타입' || v === '좌석유형') };
        break;
      }
    }
    if (head === -1) { head = 0; ci = { name: 0, seat: 4, type: 3 }; }   // 예전 구조로 폴백

    const names = [], seats = {};
    for (let i = head + 1; i < rows.length; i++) {
      const r = rows[i];
      const name = cleanName(r[ci.name]);
      if (!/^[가-힣]{2,5}\d{0,2}$/.test(name)) continue;
      names.push(name);

      const seatRaw = (r[ci.seat] || '').trim();
      const type = ci.type >= 0 ? (r[ci.type] || '').trim() : '';
      const key = matchKey(name);
      if (/집중/.test(seatRaw) || /집중/.test(type)) {
        const m = seatRaw.match(/(\d+)/);
        seats[key] = { seat: m ? +m[1] : null, type: '집중실' };
        continue;
      }
      const m = seatRaw.match(/(\d+)/);
      if (m) seats[key] = { seat: +m[1], type };
    }
    return { names, seats };
  }

  function parseCSVRow(line) {
    const result = [];
    let current = '', inQuotes = false;
    for (const char of line) {
      if (char === '"') inQuotes = !inQuotes;
      else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
      else current += char;
    }
    result.push(current.trim());
    return result;
  }

  /* ============================================================
     10. 렌더링
     ============================================================ */
  // 좌석 표시 정보 — 업로드 파일이 있으면 그것이 시트값을 덮어쓴다
  function getSeatInfo(name, floor) {
    const key = matchKey(name);
    if (focusRoomSeats[key]) return { label: '집중' + focusRoomSeats[key], cls: 'seat-focus', sort: 100000 + focusRoomSeats[key] };
    if (freeSeatMap[key]) return { label: String(freeSeatMap[key]), cls: 'seat-free', sort: freeSeatMap[key] };

    const e = (floor === 7 ? seatMap.floor7 : seatMap.floor8)[key];
    if (!e) return null;
    if (e.type === '집중실') return { label: '집중' + (e.seat || ''), cls: 'seat-focus', sort: 100000 + (e.seat || 0) };
    if (!e.seat) return null;
    const free = /자유/.test(e.type || '');
    return { label: String(e.seat), cls: free ? 'seat-free' : 'seat-num', sort: e.seat };
  }

  function copyName(name) {
    navigator.clipboard.writeText(name);
    copiedText = name;
    render();
    setTimeout(() => { copiedText = ''; render(); }, 1500);
  }
  function copyAll(names) {
    navigator.clipboard.writeText(names.join('\n'));
    alert(`${names.length}명 이름 복사 완료!`);
  }

  function render() {
    const resultDiv = document.getElementById('result');
    if (!roster.floor7.length && !roster.floor8.length) { resultDiv.innerHTML = ''; return; }

    const total = submission.submitted.size + submission.parentApproved.size + submission.supervisorApproved.size;
    if (total === 0) {
      resultDiv.innerHTML = '<div class="bg-white rounded-xl p-8 text-center text-slate-400">수능선배 제출 현황 파일을 업로드하세요</div>';
      return;
    }

    const bucket = key => {
      const list = roster[key];
      return {
        submitted: list.filter(n => submission.submitted.has(matchKey(n))),
        parentApproved: list.filter(n => submission.parentApproved.has(matchKey(n))),
        supervisorApproved: list.filter(n => submission.supervisorApproved.has(matchKey(n))),
        notSubmitted: list.filter(n => {
          const k = matchKey(n);
          return !submission.submitted.has(k) && !submission.parentApproved.has(k) && !submission.supervisorApproved.has(k);
        })
      };
    };
    const d8 = bucket('floor8'), d7 = bucket('floor7');

    const head = (floor, att) => `🏢 ${floor}층 (총 ${roster['floor' + floor].length}명)`
      + (att.present.length || att.exited.length
        ? ` <span class="text-sm font-normal text-green-600">- ${att.present.length}명 있음 / ${att.exited.length}명 나감</span>` : '');

    const block = (floor, data, att) => `
      <h2 class="text-lg font-bold mb-4">${head(floor, att)}</h2>
      ${renderSection('🟡 정기일정제출', data.submitted, 'yellow', att, floor)}
      ${renderSection('🟢 사감승인완료', data.supervisorApproved, 'green', att, floor)}
      ${renderSection('🔵 학부모승인완료', data.parentApproved, 'blue', att, floor)}
      ${renderSection('🔴 미제출', data.notSubmitted, 'red', att, floor)}`;

    resultDiv.innerHTML = `
      <div class="bg-white rounded-xl p-4 mb-4">${block(8, d8, attendance.floor8)}</div>
      <div class="bg-white rounded-xl p-4">${block(7, d7, attendance.floor7)}</div>`;
  }

  function renderSection(title, names, color, att, floor) {
    if (!names.length) return '';
    const colors = {
      red: 'bg-red-50 border-red-200 text-red-700 hover:bg-red-100',
      yellow: 'bg-yellow-50 border-yellow-200 text-yellow-700 hover:bg-yellow-100',
      blue: 'bg-blue-50 border-blue-200 text-blue-700 hover:bg-blue-100',
      green: 'bg-green-50 border-green-200 text-green-700 hover:bg-green-100'
    };
    const presentSet = new Set(att.present);
    const exitedSet = new Set(att.exited);

    // 좌석번호 순 · 좌석 없는 학생과 집중실은 뒤로
    const sorted = [...names].sort((a, b) => {
      const ia = getSeatInfo(a, floor), ib = getSeatInfo(b, floor);
      return (ia ? ia.sort : 99999) - (ib ? ib.sort : 99999);
    });

    return `
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-medium">${title} (${names.length}명)</span>
          <button onclick='copyAll(${JSON.stringify(names)})' class="text-xs text-blue-500 hover:underline">📋 전체복사</button>
        </div>
        <div class="flex flex-wrap gap-2">
          ${sorted.map(name => {
            const key = matchKey(name);
            const isPresent = presentSet.has(key);
            const isExited = !isPresent && exitedSet.has(key);
            const info = getSeatInfo(name, floor);
            return `<span onclick="copyName('${esc(name)}')" class="px-3 py-1 rounded-lg border cursor-pointer text-sm ${colors[color]} ${isPresent ? 'present' : ''} ${copiedText === name ? 'ring-2 ring-blue-400' : ''}">
              ${info ? `<span class="${info.cls}">[${esc(info.label)}]</span>` : ''}${esc(name)}${isExited ? ' <span class="text-gray-400 text-xs">나감</span>' : ''}${copiedText === name ? ' ✓' : ''}
            </span>`;
          }).join('')}
        </div>
      </div>`;
  }

  /* ================= 시작 ================= */
  initBoxes();
  loadGoogleSheets();
  </script>
</body>
</html>
